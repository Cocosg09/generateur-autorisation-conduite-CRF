server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Les données de la demande sont dans le fragment (#d=...) : jamais envoyées au serveur,
    # et le referrer est coupé pour ne rien transmettre vers d'autres sites.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        # HTML, scripts et configuration : toujours revalidés après un déploiement.
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Contrôle de santé du conteneur, indépendant du contenu déployé.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/assets/(fonts|img|vendor)/ {
        expires 7d;
    }
}
