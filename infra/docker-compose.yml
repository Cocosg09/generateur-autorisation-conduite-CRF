# Générateur d'autorisation de conduite (autorisation-conduite.croix-rouge-ariege.fr)
#
# Sur le VPS : /opt/autorisation-conduite/depot (clone du dépôt), réglages dans infra/.env
# (modèle : infra/.env.example). Lancé par /opt/autorisation-conduite/deployer.sh :
#   docker compose -f infra/docker-compose.yml up -d --build --wait
#
# Réseau partagé infra_interne : le proxy HTTPS du VPS (gestion_dps_caddy) joint ce conteneur,
# et ce conteneur joint Gestion des DPS (gestion_dps_backend) de serveur à serveur.

name: autorisation_conduite

services:
  web:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    image: autorisation_conduite:production
    container_name: autorisation_conduite_web
    restart: unless-stopped
    env_file: .env
    environment:
      URL_PUBLIQUE: https://autorisation-conduite.croix-rouge-ariege.fr
      TZ: Europe/Paris
    volumes:
      - donnees:/donnees
    read_only: true
    tmpfs:
      - /tmp
    # Écoute sur le port 80 sans être root.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # Port local (127.0.0.1 seulement) pour les contrôles depuis le VPS. Jamais ouvert sur Internet.
    ports:
      - "127.0.0.1:8084:80"
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - partage

volumes:
  donnees:
    name: autorisation_conduite_donnees

networks:
  partage:
    external: true
    name: infra_interne
