name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Génération du PDF
        run: node --test tests/*.test.mjs

  build:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html config.js CNAME assets _site/
          # Évite qu'une ancienne version des scripts reste en cache après une mise à jour
          sed -i "s#\(config\.js\|assets/js/app\.js\|assets/css/style\.css\)\"#\1?v=${GITHUB_SHA::8}\"#g" _site/index.html
          sed -i "s#from './\([a-z]*\)\.js'#from './\1.js?v=${GITHUB_SHA::8}'#" _site/assets/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
