# Tests, puis déploiement automatique sur le VPS de la DT à chaque push sur main.
#
# La clé SSH de déploiement est restreinte côté VPS (authorized_keys) au seul script
# /opt/autorisation-conduite/deployer.sh (copie de infra/deployer.sh) : elle ne permet que
# de demander le déploiement du commit testé ici, déjà présent sur main.
#
# Secrets GitHub nécessaires (Settings > Secrets and variables > Actions) :
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Génération du PDF
        run: node --test tests/*.test.mjs
      - name: Serveur
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Image Docker
        run: docker build --build-arg VERSION=${GITHUB_SHA::8} -t autorisation_conduite:ci .

  deploiement:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - name: Déploiement sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La commande transmise n'est que l'empreinte du commit : le VPS impose son propre script.
          ssh -i ~/.ssh/deploiement -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"

      - name: Vérification en ligne
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://autorisation-conduite.croix-rouge-ariege.fr/healthz; then exit 0; fi
            sleep 5
          done
          echo "::error::Le site ne répond pas après le déploiement"
          exit 1
